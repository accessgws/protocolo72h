# Netlify Configuration for Protocolo 72H PWA

[build]
  publish = "."

# SPA Rewrite: Todas as rotas apontam para index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service Worker: Nunca manter em cache agressivo no navegador para permitir atualizações instantâneas do PWA
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
    Content-Type = "application/javascript; charset=utf-8"

# Web App Manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Ícones e Assets Estáticos: Cache longo de alta performance
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers Globais de Segurança (OWASP)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
